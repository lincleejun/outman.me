name: archive share pages
on:
  schedule: [{ cron: "0 3 * * 1" }]   # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      max_days: { default: "30" }
      max_mb: { default: "500" }
      keep_days: { default: "90" }
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lincleejun/share-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: archive
      - run: node share/archive.mjs archive
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}   # the owner's PAT doubles as the share API credential
          MAX_DAYS: ${{ inputs.max_days || '30' }}
          MAX_MB: ${{ inputs.max_mb || '500' }}
          KEEP_DAYS: ${{ inputs.keep_days || '90' }}
      - run: |
          cd archive
          git config user.name archive-bot && git config user.email archive-bot@outman.cc
          git add -A && git diff --cached --quiet || git commit -qm "archive $(date -u +%F)" && git push
