name = "outman-share"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false
routes = [{ pattern = "share.outman.cc", custom_domain = true }]

# Landing page at "/"; the worker owns /share and /share/*.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/share", "/share/*"]

[[kv_namespaces]]
binding = "SHARES"
id = "24a536d7ffe64281acbc7758f8fd1337"

[vars]
SHARE_OWNER = "lincleejun"   # POST / list / delete need a GitHub token of this user (gh auth token, or a PAT in CI)
TTL_DAYS = "90"   # hard cap: deleted 90 days after creation even if the archive job never runs; "0" = keep forever
