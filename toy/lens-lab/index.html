<script type="module">
/*OPTICS*/
// Sequential 3D ray trace through a real prescription. Units: mm. Optical axis = +z, surface 1 vertex at z=0 when focused at ∞.
const WL={R:.6438469,G:.546074,B:.4799914};   // µm: C', e, F'
const S=(R,t,n,v,h,K)=>[R,t,n,v,h,K];
const LENSES={
 summilux35aa:{name:'Summilux 35 AA',full:'Leica Summilux-M 35mm f/1.4 Aspherical（双非球面 "AA"，1990–94）',
  src:'US 5,161,060 例 1 · Walter Watz / Leica · 9 片 5 组 · n_e ν_e · 口径按专利图 1 估算',Nmax:1.4,Dmin:700,flange:27.8,blades:10,
  surf:[ // R, 到下一面间隔, 其后介质 n_e, ν_e, 半口径, 非球面 K(1..6)：p(s)=Σ K(n)(s²/2)^n
   S(-110.114,2.010,1.503,56.1,16.8),S(24.920,7.400,1.820,45.1,16.8),S(-305.000,.100,1,0,16.8),
   S(28.346,6.070,1.820,45.1,11.5,[.35278e-1,-.39034e-4,-.31407e-6,.51317e-8,-.67514e-10,.30151e-12]),
   S(-57.560,1.610,1.694,31.0,11.5),S(16.624,4.340,1,0,9.4),S(0,1.660,1,0,0),
   S(-197.204,6.070,1.792,47.2,9.5),S(-38.628,1.500,1,0,9.5),
   S(-21.142,1.720,1.652,33.6,10.6),S(101.985,5.860,1.820,45.1,10.6),S(-21.905,.110,1,0,10.6),
   S(60.026,5.940,1.820,45.1,12.8,[.16659e-1,-.23435e-4,.32059e-7,.20560e-9,-.55738e-11,.23730e-13]),
   S(-31.325,2.050,1.624,36.1,12.8),S(31.325,19.595,1,0,12.8)]},
 sonnar1934:{name:'Sonnar 92mm f/1.5',full:'Zeiss Sonnar f/1.5（Bertele 1934）',
  src:'US 1,975,678 · Ludwig Bertele · 7 片 3 组 · n_d ν_d · 口径取自 Zemax 文件（nzhagen/LensLibrary）',Nmax:1.5,Dmin:1000,flange:34.85,blades:10,bestFocus:true,   // Zemax BFL is the paraxial image; a camera is set to best focus
  
  surf:[S(60.61502,10.5,1.6375,56.1,34.23),S(416.77,.5,1,0,33.61),S(37.26,11.7,1.6727,47.3,26.74),S(104.34,7.6,1.4675,65.7,24.81),
   S(-247,1.9,1.689,31.0,22.55),S(22.14,11.95,1,0,17.1),S(0,1.95,1,0,0),S(1904,3.4,1.5481,45.9,18.33),S(59.85,22.4,1.6578,51.2,21.58),
   S(-22.06,8.4,1.5488,63.0,21.7),S(-89.06,34.75113,1,0,26.7)]}};

// ponytail: Abbe number -> 2-term Cauchy through n_e; real glass wants Sellmeier from the maker's catalogue.
function nAt(s,lam){if(s.n===1)return 1;const B=(s.n-1)/s.v/(1/WL.B**2-1/WL.R**2);return s.n+B*(1/lam**2-1/WL.G**2);}
// Leica's asphere: p = Σ K(n)(s²/2)^n where s is the CHORD from the vertex (s² = r² + p²), so K(1)=1/R alone is the exact sphere.
const polyK=(K,u)=>{const q=u/2;let p=0,dp=0,qn=1;K.forEach((k,i)=>{dp+=k*(i+1)*qn/2;qn*=q;p+=k*qn;});return [p,dp];};   // F(u), F'(u)
function sag(s,r2){if(s.K){let p=0;for(let i=0;i<40;i++){const n=polyK(s.K,r2+p*p)[0];if(Math.abs(n-p)<1e-13)return n;p=n;}return p;}
 if(!s.c)return 0;const a=1-s.c*s.c*r2;return a<0?NaN:(1-Math.sqrt(a))/s.c;}
function dsag(s,r2){if(s.K){const p=sag(s,r2),dF=polyK(s.K,r2+p*p)[1];return dF/(1-2*p*dF);}   // d sag / d r²
 if(!s.c)return 0;return s.c/(2*Math.sqrt(Math.max(1e-12,1-s.c*s.c*r2)));}

// o,d: [x,y,z]; ext: how far the optical block has moved toward the object (unit focusing); stopR: iris radius.
// Returns the sensor hit and the exit ray, or null if glass edge / iris / TIR stops it. pts (optional) collects every vertex.
function trace(L,o,d,lam,ext,stopR,pts,clip=true){
 let [ox,oy,oz]=o,[dx,dy,dz]=d,n1=1,x=ox,y=oy,z=oz;
 for(const s of L.S){
  const zv=s.z-ext;let t=(zv-oz)/dz,r2=0;
  for(let i=0;i<20;i++){x=ox+t*dx;y=oy+t*dy;r2=x*x+y*y;const sg=sag(s,r2);if(!isFinite(sg))return null;
   const f=oz+t*dz-zv-sg,fp=dz-2*dsag(s,r2)*(x*dx+y*dy),st=f/fp;t-=st;if(Math.abs(st)<1e-11)break;}
  x=ox+t*dx;y=oy+t*dy;z=oz+t*dz;r2=x*x+y*y;if(pts)pts.push(x,y,z);
  const lim=s.stop?stopR:s.h;if(clip&&r2>lim*lim)return null;
  const n2=nAt(s,lam);
  if(n2!==n1){const g=dsag(s,r2);let nx=-2*x*g,ny=-2*y*g,nz=1;const m=Math.hypot(nx,ny,nz);nx/=m;ny/=m;nz/=m;
   const ci=dx*nx+dy*ny+dz*nz,e=n1/n2,k=1-e*e*(1-ci*ci);if(k<0)return null;const a=Math.sqrt(k)-e*ci;
   dx=e*dx+a*nx;dy=e*dy+a*ny;dz=e*dz+a*nz;const dm=Math.hypot(dx,dy,dz);dx/=dm;dy/=dm;dz/=dm;}
  n1=n2;ox=x;oy=y;oz=z;}
 const t=(L.sensorZ-oz)/dz,sx=ox+t*dx,sy=oy+t*dy;if(pts)pts.push(sx,sy,L.sensorZ);
 return {x:sx,y:sy,px:ox,py:oy,pz:oz,dx,dy,dz};}

const norm=v=>{const m=Math.hypot(v[0],v[1],v[2]);return [v[0]/m,v[1]/m,v[2]/m];};
const axisZ=r=>r.pz-r.py*r.dz/r.dy;                                  // where an exit ray crosses the axis
const para=(L,o,d,ext=0)=>trace(L,o,d,WL.G,ext,1e9,null,false);
function stopY(L,o,d,ext){const p=[];trace(L,o,d,WL.G,ext,1e9,p,false);return p[L.stopIdx*3+1];}

function buildLens(def){
 let z=0;const Sf=def.surf.map(a=>{const s={R:a[0],t:a[1],n:a[2],v:a[3],h:a[4],K:a[5]||null,stop:a[0]===0,z};s.c=s.R?1/s.R:0;z+=s.t;return s;});
 const L={def,S:Sf,sensorZ:z,stopIdx:Sf.findIndex(s=>s.stop),lastZ:Sf[Sf.length-1].z};
 const h=.01,r=para(L,[0,h,-5],[0,0,1]);
 L.efl=-h*r.dz/r.dy;L.zInf=axisZ(r);L.bfl=L.zInf-L.lastZ;
 L.kStop=stopY(L,[0,h,-5],[0,0,1],0)/h;                                // stop radius / entrance-pupil radius
 const th=1e-3,z0=-300,dd=[0,Math.sin(th),Math.cos(th)],a=stopY(L,[0,0,z0],dd,0),b=stopY(L,[0,1,z0],dd,0)-a,h0=-a/b;
 L.zEP=z0-h0/Math.tan(th);                                            // entrance pupil: the stop as seen from the front
 L.rEP=N=>L.efl/(2*N);L.stopR=N=>L.rEP(N)*L.kStop;
 L.S[L.stopIdx].h=L.stopR(def.Nmax);
 for(const D of [1e7,def.Dmin]){const ext=focusExt(L,D),P=[0,0,L.sensorZ-D],R=L.rEP(def.Nmax);   // glass must pass the full axial beam
  for(const [u,v] of [[0,R],[0,-R],[R,0]]){const p=[];trace(L,P,norm([u-P[0],v-P[1],L.zEP-ext-P[2]]),WL.G,ext,1e9,p,false);
   L.S.forEach((s,i)=>{if(!s.stop)s.h=Math.max(s.h,Math.hypot(p[i*3],p[i*3+1])*1.02);});}}
 if(def.bestFocus){let a=-3,b=1;const f=dz=>{L.sensorZ+=dz;const r=rms(spot(L,[0,0,L.sensorZ-1e7],def.Nmax,0,[WL.G],21)).r;L.sensorZ-=dz;return r;};
  for(let i=0;i<40;i++){const m1=a+(b-a)*.382,m2=a+(b-a)*.618;f(m1)<f(m2)?(b=m2):(a=m1);}L.sensorZ+=(a+b)/2;L.focusShift=(a+b)/2;}   // golden-section on axial rms
 return L;}

// unit focusing (Leica helicoid): the whole block moves out until the paraxial image of a point D from the film lands where ∞ did
function focusExt(L,D){if(!isFinite(D)||D>=1e7)return 0;let lo=0,hi=60;
 for(let i=0;i<50;i++){const e=(lo+hi)/2,zo=L.sensorZ-D,r=para(L,[0,0,zo],norm([0,.01,-e-zo]),e);
  ((r&&axisZ(r)>L.zInf)?(lo=e):(hi=e));}return (lo+hi)/2;}

// chief ray: the ray from P through the centre of the stop, found by secant along the meridional direction on the EP plane
function aimChief(L,P,ext){const rr=Math.hypot(P[0],P[1]),u=rr>1e-9?[P[0]/rr,P[1]/rr]:[0,1],zp=L.zEP-ext;
 const ys=s=>{const p=[];const d=norm([u[0]*s-P[0],u[1]*s-P[1],zp-P[2]]);const r=trace(L,P,d,WL.G,ext,1e9,p,false);
  return r?p[L.stopIdx*3]*u[0]+p[L.stopIdx*3+1]*u[1]:NaN;};
 let s0=0,s1=.5,y0=ys(s0),y1=ys(s1);
 for(let i=0;i<30&&Math.abs(y1)>1e-9&&y1!==y0;i++){const s2=s1-y1*(s1-s0)/(y1-y0);if(!isFinite(s2))break;s0=s1;y0=y1;s1=s2;y1=ys(s1);if(!isFinite(y1)){s1=s0;break;}}
 return {c:[u[0]*s1,u[1]*s1,zp],u};}

let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function spot(L,P,N,ext,lams,n=25){const {c}=aimChief(L,P,ext),R=L.rEP(N)*1.35,out=[];seed=7;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){const u=((i+rnd())/n*2-1)*R,v=((j+rnd())/n*2-1)*R;if(u*u+v*v>R*R)continue;
  for(const lam of lams){const r=trace(L,P,norm([c[0]+u-P[0],c[1]+v-P[1],c[2]-P[2]]),lam,ext,L.stopR(N));if(r)out.push({x:r.x,y:r.y,lam});}}
 return out;}
function rms(h){if(!h.length)return NaN;let cx=0,cy=0;for(const p of h){cx+=p.x;cy+=p.y;}cx/=h.length;cy/=h.length;
 let s=0;for(const p of h)s+=(p.x-cx)**2+(p.y-cy)**2;return {r:Math.sqrt(s/h.length),cx,cy};}
// a meridional fan across the wide-open pupil, traced at the CURRENT stop: rays the iris or a glass rim stops come back with ok=false
// and their points end where they were stopped (hit = index of that surface)
function fan(L,P,N,ext,lam,count=13){const {c,u}=aimChief(L,P,ext),R=L.rEP(L.def.Nmax)*.97,out=[];
 for(let k=0;k<count;k++){const s=(k/(count-1)*2-1)*R,p=[];const d=norm([c[0]+u[0]*s-P[0],c[1]+u[1]*s-P[1],c[2]-P[2]]);
  const r=trace(L,P,d,lam,ext,L.stopR(N),p);if(p.length<3)continue;out.push({p,ok:!!r,hit:r?-1:p.length/3-1,u,k,lam,P});}
 return out;}
// the edge of the beam that actually gets through (iris + every glass rim), one ray per azimuth: its envelope is the light cone
function rim(L,P,N,ext,lam,n=32){const {c}=aimChief(L,P,ext),sr=L.stopR(N),out=[];
 const go=(e,s,p)=>trace(L,P,norm([c[0]+e[0]*s-P[0],c[1]+e[1]*s-P[1],c[2]-P[2]]),lam,ext,sr,p);
 for(let k=0;k<n;k++){const a=k/n*Math.PI*2,e=[Math.cos(a),Math.sin(a)];if(!go(e,0))return null;let lo=0,hi=L.rEP(N)*3;
  for(let i=0;i<18;i++){const m=(lo+hi)/2;go(e,m)?(lo=m):(hi=m);}const p=[];go(e,lo,p);out.push(p);}
 return out;}
// groups = runs of glass with no air inside (cemented). Paraxial power from the y-nu matrix of the group's own surfaces.
function groups(L){const G=[];let a=-1;L.S.forEach((s,i)=>{if(s.n!==1&&a<0)a=i;if(s.n===1&&a>=0){G.push({a,b:i});a=-1;}});
 for(const g of G){let A=1,B=0,C=0,D=1,n1=1;for(let i=g.a;i<=g.b;i++){const s=L.S[i],P=(s.n-n1)*s.c;C-=P*A;D-=P*B;
   if(i<g.b){const T=s.t/s.n;A+=T*C;B+=T*D;}n1=s.n;}g.phi=-C;}
 return G;}
const piecePower=(a,b)=>{const n=a.n;return (n-1)*(a.c-b.c)+(n-1)**2*a.t*a.c*b.c/n;};   // thick lens in air

  for(const p of h){SX.fillStyle=ST.chroma?lc[Object.keys(WL).find(k=>WL[k]===p.lam)]:S.col;SX.globalAlpha=.55;SX.fillRect(cx-(p.x-r.cx)*sc-1,cy+(p.y-r.cy)*sc-1,2,2);}
  SX.globalAlpha=1;SX.restore();
  const bar=[1,2,5,10,20,50,100,200,500,1000,2000].find(b=>b/1e3*sc>40)||2000;
  SX.fillStyle='#fff';SX.fillRect(x0+14,242,bar/1e3*sc,2);SX.font='13px ui-monospace,Menlo';SX.fillStyle='#95a0bb';SX.fillText(bar+' µm',x0+14+bar/1e3*sc+6,248);
  SX.fillStyle=S.col;SX.fillText(`${S.name} ${S.Z} m`,x0+12,17);SX.fillStyle='#fff';SX.fillText(isFinite(r.r)?`rms ${(r.r*1e3).toFixed(0)} µm`:'被挡',x0+w-100,17);});
 return out;}


// ---------------------------------------------------------------- rays: trace, then paint (selection only repaints)
const lamOf=r=>WL[r.l];
function traceAll(ext){RAYS=[];const lams=ST.chroma?['R','G','B']:['G'];
 SUBJ.forEach((S,i)=>{const P=[S.X*1e3,S.Y*1e3,L.sensorZ-S.Z*1e3],start=subjPos(S);
  for(const l of lams){const fr=fan(L,P,ST.N,ext,WL[l],ST.chroma?7:13);
   const Lr=fr.map(r=>Math.hypot(r.p[0]-P[0],r.p[1]-P[1],r.p[2]-P[2])),Lmin=Math.min(...Lr);
   fr.forEach((r,q)=>{const w=[start],w0=[start];for(let j=0;j<r.p.length;j+=3){w.push(WS(r.p,j));w0.push(W3(r.p,j));}
    // virtual optical path: the (compressed) object leg is stretched so that inside the glass equal values = the true wavefront
    const cum=[0,start.distanceTo(w[1])+(Lr[q]-Lmin)];for(let j=1;j<w.length-1;j++)cum.push(cum[j]+nAt(L.S[j-1],WL[l])*w0[j].distanceTo(w0[j+1]));   // true path length, even when spread
    RAYS.push({...r,subj:i,l,w,cum});});}});}
const selIdx=()=>ST.ray?RAYS.findIndex(r=>r.subj===ST.ray.subj&&r.l===ST.ray.l&&r.k===ST.ray.k):-1;
function paint(){
 for(const o of [raysObj,endsObj,selObj,coneObj])if(o){root.remove(o);o.traverse(m=>m.geometry&&m.geometry.dispose());}
 const si=selIdx(),pos=[],col=[],ends=[],c=new THREE.Color();segRay=[];
 RAYS.forEach((r,id)=>{c.set(!r.ok?'#ff4d4d':ST.chroma?LC[r.l]:SUBJ[r.subj].col);
  let k=r.subj!==ST.subj?.14:si>=0&&si!==id?.35:1;c.multiplyScalar(k);
  for(let j=0;j<r.w.length-1;j++){pos.push(...r.w[j].toArray(),...r.w[j+1].toArray());col.push(c.r,c.g,c.b,c.r,c.g,c.b);segRay.push(id);}
  if(!r.ok&&r.subj===ST.subj)ends.push(...r.w[r.w.length-1].toArray());});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 raysObj=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));root.add(raysObj);
 const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ends,3));
 endsObj=new THREE.Points(eg,new THREE.PointsMaterial({color:'#ff5a5a',size:5,sizeAttenuation:false}));root.add(endsObj);
 coneObj=null;if(ST.cone){const S=SUBJ[ST.subj],rr=rim(L,[S.X*1e3,S.Y*1e3,L.sensorZ-S.Z*1e3],ST.N,ST.ext,WL.G);
  if(rr){const start=subjPos(S),M=rr[0].length/3+1,v=[],idx=[];
   rr.forEach(p=>{v.push(...start.toArray());for(let j=0;j<p.length;j+=3)v.push(...WS(p,j).toArray());});
   for(let k=0;k<rr.length;k++){const k2=(k+1)%rr.length;for(let j=0;j<M-1;j++){const a=k*M+j,b=k2*M+j;idx.push(a,b,a+1,b,b+1,a+1);}}
   const cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.Float32BufferAttribute(v,3));cg.setIndex(idx);
   coneObj=new THREE.Mesh(cg,new THREE.MeshBasicMaterial({color:S.col,transparent:true,opacity:.09,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));root.add(coneObj);}}
 selObj=null;const box=$('#raybox');box.hidden=si<0;
 if(si>=0){const r=RAYS[si];selObj=new THREE.Group();root.add(selObj);
  const path=new THREE.CurvePath();for(let j=0;j<r.w.length-1;j++)path.add(new THREE.LineCurve3(r.w[j],r.w[j+1]));
  selObj.add(new THREE.Mesh(new THREE.TubeGeometry(path,r.w.length*12,.32,8),new THREE.MeshBasicMaterial({color:r.ok?'#ffffff':'#ff6b6b'})));
  const nl=[];for(let j=1;j<r.w.length-1;j++){const s=L.S[j-1];if(!s||s.stop)continue;const x=r.p[(j-1)*3],y=r.p[(j-1)*3+1],gg=dsag(s,x*x+y*y);
   const n=W([-2*x*gg,-2*y*gg,1]).normalize().multiplyScalar(4);nl.push(r.w[j].clone().sub(n),r.w[j].clone().add(n));}
  const ng=new THREE.BufferGeometry().setFromPoints(nl),nm=new THREE.LineDashedMaterial({color:'#9aa6c4',dashSize:.6,gapSize:.5});const nlo=new THREE.LineSegments(ng,nm);nlo.computeLineDistances();selObj.add(nlo);
  $('#rayTitle').innerHTML=`<b style="color:${SUBJ[r.subj].col}">${SUBJ[r.subj].name}</b> 的第 ${r.k+1} 条光线${ST.chroma?'（'+{R:'红',G:'绿',B:'蓝'}[r.l]+'光）':''} · 虚线 = 每一面的法线`;
  $('#rayTbl').innerHTML=rayTable(r);}}
function rayTable(r){const u=r.u,lam=lamOf(r),pt=j=>[r.p[j*3],r.p[j*3+1],r.p[j*3+2]],h=j=>r.p[j*3]*u[0]+r.p[j*3+1]*u[1];
 const ang=(a,b)=>Math.atan2((b[0]-a[0])*u[0]+(b[1]-a[1])*u[1],b[2]-a[2])*180/Math.PI;
 const grp=j=>{const i=G.findIndex(g=>g.a<=j&&j<=g.b);return i<0?'—':'G'+(i+1);};
 const rows=[];let n1=1;const nP=r.p.length/3;
 for(let j=0;j<nP;j++){
  if(r.ok&&j===nP-1){rows.push(`<tr><td class="l">胶片</td><td></td><td>${h(j).toFixed(2)}</td><td></td><td class="l">落点（中心 = 光轴）</td></tr>`);break;}
  const s=L.S[j],a0=ang(j?pt(j-1):r.P,pt(j)),name=s.stop?'光阑':'面 '+(j+1)+(s.K?'*':'');
  if(!r.ok&&j===r.hit){rows.push(`<tr><td class="l">${name}</td><td class="l">${grp(j)}</td><td>${h(j).toFixed(2)}</td><td>${a0.toFixed(1)}°</td><td class="l blk">${s.stop?'被光圈叶片挡住':'撞到镜片边缘（渐晕）'}</td></tr>`);break;}
  const a1=ang(pt(j),pt(j+1)),n2=nAt(s,lam),d=a1-a0;let eff,cls='';
  if(s.stop)eff=`从开口穿过（开口半径 ${L.stopR(ST.N).toFixed(2)} mm）`;else if(Math.abs(d)<.05)eff='几乎不折';
  else if(h(j)*d<0){eff='向光轴折 · 会聚';cls='pos';}else{eff='离光轴折 · 发散';cls='neg';}
  rows.push(`<tr><td class="l">${name}</td><td class="l">${grp(j)}</td><td>${h(j).toFixed(2)}</td><td>${s.stop?a0.toFixed(1)+'°':a0.toFixed(1)+'° → '+a1.toFixed(1)+'°'}</td><td class="l ${cls}">${s.stop?'':`n ${n1.toFixed(3)}→${n2.toFixed(3)} · `}${eff}</td></tr>`);n1=n2;}
 return '<tr><th class="l">面</th><th class="l">组</th><th>高度 mm</th><th>与光轴夹角</th><th class="l">折射率 · 这一面做了什么</th></tr>'+rows.join('');}

// ---------------------------------------------------------------- wavefronts (constant optical path) and a photon on the picked ray
const WMAX=24000;const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(WMAX*3),3));
waveObj=new THREE.LineSegments(wg,new THREE.LineBasicMaterial({color:'#ffffff',transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));waveObj.frustumCulled=false;scene.add(waveObj);
photon=new THREE.Mesh(new THREE.SphereGeometry(.9,16,12),new THREE.MeshBasicMaterial({color:'#ffffff'}));scene.add(photon);
const at=(r,s,out)=>{const c=r.cum;if(s<0||s>c[c.length-1])return null;let j=1;while(j<c.length-1&&c[j]<s)j++;j--;return out.lerpVectors(r.w[j],r.w[j+1],(s-c[j])/(c[j+1]-c[j]||1));};
const _a=new THREE.Vector3(),_b=new THREE.Vector3();
function wave(t){const arr=wg.attributes.position.array;let n=0;
 if(ST.wave){const fr=RAYS.filter(r=>r.subj===ST.subj&&r.l===(ST.chroma?'G':r.l)).sort((a,b)=>a.k-b.k),D=5,s0=(t*28)%D;
  const top=Math.max(0,...fr.map(r=>r.cum[r.cum.length-1]));
  for(let s=s0;s<top&&n<WMAX-6;s+=D)for(let q=0;q+1<fr.length;q++){if(!at(fr[q],s,_a)||!at(fr[q+1],s,_b))continue;arr.set([_a.x,_a.y,_a.z,_b.x,_b.y,_b.z],n);n+=6;}}
 wg.setDrawRange(0,n/3);wg.attributes.position.needsUpdate=true;
 const si=selIdx();photon.visible=si>=0;if(si>=0){const r=RAYS[si],e=r.cum[r.cum.length-1];at(r,(t*40)%e,photon.position);}}

// ---------------------------------------------------------------- the iris, front view
const IC=$('#iris'),IX=IC.getContext('2d');
function drawIris(){const n=L.def.blades,W2=IC.width,c=W2/2,ro=c-4,k=L.stopR(ST.N)/L.stopR(L.def.Nmax),rp=ro*.78*k,tw=.7;
 IX.clearRect(0,0,W2,W2);IX.fillStyle='#0b0f1c';IX.beginPath();IX.arc(c,c,ro,0,7);IX.fill();
 IX.save();IX.beginPath();IX.arc(c,c,ro,0,7);IX.clip();
 for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;IX.beginPath();IX.moveTo(c+rp*Math.cos(a0),c+rp*Math.sin(a0));IX.lineTo(c+rp*Math.cos(a1),c+rp*Math.sin(a1));
  for(let s=0;s<=8;s++){const a=a1+tw-(a1-a0)*s/8;IX.lineTo(c+ro*1.2*Math.cos(a),c+ro*1.2*Math.sin(a));}IX.closePath();IX.fillStyle=i%2?'#3a332b':'#2b2621';IX.fill();IX.strokeStyle='#6b5a44';IX.stroke();}
 IX.restore();IX.strokeStyle='#ffb454';IX.lineWidth=2;IX.beginPath();for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;IX[i?'lineTo':'moveTo'](c+rp*Math.cos(a),c+rp*Math.sin(a));}IX.stroke();IX.lineWidth=1;
 $('#irisTxt').innerHTML=`<b>f/${ST.N}</b> · 入瞳 ${(2*L.rEP(ST.N)).toFixed(1)} mm<br>进光量是全开的 <b>${Math.round(100*(L.def.Nmax/ST.N)**2)}%</b><br>${L.stopWhere}<br><span style="color:#95a0bb">叶片数为示意</span>`;}
function buildIris(){irisG.clear();const n=L.def.blades,ro=L.rMax+.6,rp=L.stopR(ST.N)/Math.sqrt(Math.cos(Math.PI/n)),tw=.7;
 const V=k=>{const a=k/n*Math.PI*2;return new THREE.Vector2(rp*Math.cos(a),rp*Math.sin(a));};
 for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;let t=(a0+a1)/2+tw/2;t=Math.atan2(Math.sin(t),Math.cos(t));
  if(t>-Math.PI&&t<-Math.PI/2)continue;                                                // this blade sits in the cut-away quarter
  const sh=new THREE.Shape([V(i),V(i+1)]);for(let k=0;k<=8;k++){const a=a1+tw-(a1-a0)*k/8;sh.lineTo(ro*Math.cos(a),ro*Math.sin(a));}sh.closePath();
  irisG.add(new THREE.Mesh(new THREE.ShapeGeometry(sh),bladeMat[i%2]));
  irisG.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(sh.getPoints().map(p=>new THREE.Vector3(p.x,p.y,.05))),bladeEdge));}
 const op=[];for(let k=0;k<=n;k++){const v=V(k);op.push(new THREE.Vector3(v.x,v.y,.1));}irisG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(op),amberLine));
 L.stopTag.element.innerHTML=`<b>光圈 f/${ST.N}</b> · ${L.stopWhere}`;}

// ---------------------------------------------------------------- UI
const fmtD=D=>!isFinite(D)||D>=1e7?'∞':D>=1e4?(D/1e3).toFixed(0)+' m':(D/1e3).toFixed(2)+' m';
function setLens(k){ST.key=k;L=buildLens(LENSES[k]);G=groups(L);layers=mkLayers();ST.N=Math.max(ST.N,L.def.Nmax);ST.D=Math.max(ST.D,L.def.Dmin);ST.ray=null;
 $('#lname').textContent=L.def.name;$('#lsrc').textContent=L.def.full+' · '+L.def.src;
 $('#ap').innerHTML=STOPS.filter(n=>n>=L.def.Nmax).map(n=>`<button data-n="${n}">f/${n}</button>`).join('');
 $('#rx').innerHTML='<tr><th>#</th><th>R</th><th>d</th><th>n</th><th>ν</th><th>半口径</th></tr>'+L.S.map((s,i)=>
  `<tr class="${s.K?'a':s.stop?'s':''}"><td>${s.stop?'光阑':i+1}${s.K?'*':''}</td><td>${s.stop?'∞':s.R}</td><td>${s.t}</td><td>${s.n===1?'':s.n}</td><td>${s.n===1?'':s.v}</td><td>${s.stop?'—':s.h.toFixed(1)}</td></tr>`).join('');
 setGap();build3D();view(VIEW);refresh();}
let pending=false;const refresh=()=>{if(!pending){pending=true;requestAnimationFrame(update);}};
let heavyT=0;
function update(){pending=false;const ext=ST.ext=focusExt(L,ST.D);moving.position.y=-ext;
 $('#focus').value=Math.round((!isFinite(ST.D)||ST.D>=1e7?0:1/ST.D)*L.def.Dmin*1000);$('#fD').textContent=fmtD(ST.D);$('#apN').textContent='f/'+ST.N;
 document.querySelectorAll('#ap button').forEach(b=>b.classList.toggle('on',+b.dataset.n===ST.N));
 $('#subj').innerHTML=SUBJ.map((S,i)=>`<button data-i="${i}" class="${i===ST.subj?'on':''}" style="${i===ST.subj?'':'color:'+S.col}">${S.name} ${S.Z} m</button>`).join('');
 const d=disp(Math.min(ST.D,1e7));fplane.position.x=L.zEP-d;fplane.scale.setScalar(d/L.efl);fplane.userData.tag.element.textContent='焦平面 · '+fmtD(ST.D);
 buildIris();drawIris();traceAll(ext);paint();
 clearTimeout(heavyT);heavyT=setTimeout(()=>heavy(ext),90);}   // photo + spots cost ~0.2 s: only once the ring stops
function heavy(ext){composePhoto(ext);const sp=drawSpots(ext);
 const f=L.efl,c=.03,H=f*f/(ST.N*c)+f,D=Math.min(ST.D,1e9),dn=D*(H-f)/(H+D-2*f),df=D<H?D*(H-f)/(H-D):Infinity;
 $('#stats').innerHTML=[['焦距（追迹）',f.toFixed(2)+' mm'],['镜组外移',ext.toFixed(2)+' mm'],
  ['景深 (c=30µm)',D<1e7?`${fmtD(dn)} – ${fmtD(df)}`:`${fmtD(H)} – ∞`],['入瞳直径',(2*L.rEP(ST.N)).toFixed(1)+' mm'],
  ...SUBJ.map((S,i)=>[S.name+' 光斑 rms',isFinite(sp[i])?(sp[i]*1e3).toFixed(0)+' µm':'—'])].map(([a,b])=>`<div class="stat"><i>${a}</i><b>${b}</b></div>`).join('');
 const sharp=SUBJ.filter((S,i)=>sp[i]<.04).map(S=>S.name);
 $('#why').innerHTML=(sharp.length?`<b>${sharp.join('、')}</b> 在焦平面上：它的光锥在胶片上收成一点。其余物体的光锥在胶片前或后就收拢了，落到胶片上是一块光斑。`:
  (()=>{const i=sp.indexOf(Math.min(...sp.filter(isFinite))),S=SUBJ[i],inPlane=Math.abs(1/(S.Z*1e3)-1/Math.min(ST.D,1e9))<2e-5;
   return inPlane?`<b>${S.name}</b> 就在焦平面上，光斑却还有 ${(sp[i]*1e3).toFixed(0)} µm：这是镜头自身的像差（主要是球差），不是没对准。收小光圈会变锐。`
    :'三个物体都不在焦平面上，光锥都没在胶片上收拢。';})())+` 对焦 = 整组镜片外移 <b>${ext.toFixed(2)} mm</b>。`;}

let VIEW='all';const tw={t:1,p0:new THREE.Vector3(),p1:new THREE.Vector3(),q0:new THREE.Vector3(),q1:new THREE.Vector3()};
function view(v){VIEW=v;document.querySelectorAll('#views button[data-v]:not([data-v=cut])').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 const fz=L.sensorZ+L.shEnd,k=fz/66,T={all:[[L.zEP-110,-10,0],[L.zEP-60,170,540]],lens:[[34*k,-4*k,0],[8*k,70*k,150*k]],body:[[fz-25,8,0],[fz-150,75,190]]}[v];
 tw.p0.copy(camera.position);tw.q0.copy(controls.target);tw.p1.set(...T[1]);tw.q1.set(...T[0]);tw.t=camera.position.lengthSq()&&!document.hidden?0:1;if(tw.t)camera.position.copy(tw.p1),controls.target.copy(tw.q1);}
$('#views').onclick=e=>{const v=e.target.dataset.v;if(!v)return;if(v==='cut'){ST.cut=!ST.cut;e.target.classList.toggle('on',ST.cut);buildBody();return;}view(v);};

$('#lens').innerHTML=Object.entries(LENSES).map(([k,d])=>`<option value="${k}">${d.full}</option>`).join('');
$('#lens').onchange=e=>setLens(e.target.value);
let gapPending=false;$('#gap').oninput=e=>{ST.gap=+e.target.value;$('#gapN').textContent='+'+ST.gap+' mm';if(gapPending)return;gapPending=true;
 requestAnimationFrame(()=>{gapPending=false;setGap();build3D();update();});};   // rebuild on screen only; the photo does not change
$('#focus').oninput=e=>{const q=e.target.value/1000/L.def.Dmin;ST.D=q<1e-7?Infinity:1/q;refresh();};
$('#fpre').onclick=e=>{const d=e.target.dataset.d;if(!d)return;ST.D=d==='inf'?Infinity:Math.max(+d,L.def.Dmin);refresh();};

$('#subj').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;ST.subj=+i;ST.ray=null;update();};

$('#photo').onclick=()=>$('.right').classList.toggle('big');
const pick=(r)=>{ST.subj=r.subj;ST.ray={subj:r.subj,l:r.l,k:r.k};$('#subj').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===ST.subj));paint();};
const step=d=>{const si=selIdx();if(si<0)return;const r=RAYS[si],fr=RAYS.filter(q=>q.subj===r.subj&&q.l===r.l).sort((a,b)=>a.k-b.k),i=fr.indexOf(r);pick(fr[(i+d+fr.length)%fr.length]);};
$('#rPrev').onclick=()=>step(-1);$('#rNext').onclick=()=>step(1);$('#rClose').onclick=()=>{ST.ray=null;paint();};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape'){ST.ray=null;paint();}});
const rc=new THREE.Raycaster();let down=null;

canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
 rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);rc.params.Line.threshold=Math.max(.3,camera.position.distanceTo(controls.target)/250);
 const hits=rc.intersectObject(raysObj);const h=hits.find(h=>RAYS[segRay[h.index>>1]].subj===ST.subj)||hits[0];   // prefer the bundle in focus of attention
 if(h)pick(RAYS[segRay[h.index>>1]]);else if(ST.ray){ST.ray=null;paint();}});

addEventListener('resize',resize);resize();
setLens(ST.key);
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{if(tw.t<1){tw.t=Math.min(1,tw.t+.03);const e=1-(1-tw.t)**3;camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.q0,tw.q1,e);}
 controls.update();const far=L&&camera.position.distanceTo(controls.target)>260*(L.sensorZ+L.shEnd)/66;document.querySelectorAll('.tag.grp').forEach(e=>e.style.visibility=far?'hidden':'');wave(clock.getElapsedTime());renderer.render(scene,camera);labels.render(scene,camera);});
window.__lab={get L(){return L},ST,get RAYS(){return RAYS},trace,spot,rms,aimChief,focusExt,WL,pick,view};
