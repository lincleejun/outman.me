<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>outman</title>
<meta name="description" content="outman — projects and tools.">
<link rel="canonical" href="https://outman.cc/">
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafaf7; --mut: #6b6b6b; --line: rgba(127,127,127,.25); --acc: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #111; --mut: #9a9a9a; --acc: #fb923c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 720px; margin: 10vh auto; padding: 0 16px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; }
  .tag { color: var(--mut); margin: 4px 0 40px; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin: 32px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
  li a { color: var(--fg); text-decoration: none; }
  li a:hover { color: var(--acc); }
  .pitch { color: var(--mut); font-size: 14px; }
  .year { color: var(--mut); font-size: 13px; }
  .t1 li a { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="name"></h1>
  <p class="tag" id="tagline"></p>
  <section class="t1"><h2>products</h2><ul id="tier1"></ul></section>
  <section><h2>more</h2><ul id="tier2"></ul></section>
</main>
<script>
  fetch("/data/projects.json").then(r => r.json()).then(d => {
    name.textContent = d.name; tagline.textContent = d.tagline;
    for (const p of d.projects) {
      const li = document.createElement("li");
      li.innerHTML = `<div><a href="${p.href}">${p.name}</a><div class="pitch">${p.pitch}</div></div><span class="year">${p.year}</span>`;
      (p.tier === 1 ? tier1 : tier2).append(li);
    }
    if (!tier2.children.length) tier2.parentElement.remove();
  });
</script>
</body>
</html>
